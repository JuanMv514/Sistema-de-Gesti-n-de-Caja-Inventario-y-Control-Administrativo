<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vidrios y Aluminios El Carmen</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    // Paleta corporativa: azul marino y blanco
    tailwind.config = {
      theme: { extend: { colors: { navy: {
        50: "#f0f4fa", 100: "#dbe4f3", 200: "#b7c9e6", 300: "#8aa6d3",
        600: "#254079", 700: "#1b2f5e", 800: "#14244a", 900: "#0b1a3a"
      } } } }
    };
  </script>
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body class="bg-navy-50 text-navy-900 min-h-screen">

  <!-- Navegación: oculta hasta que haya sesión activa -->
  <nav id="main-nav" class="hidden bg-navy-900 text-white">
    <div class="max-w-6xl mx-auto px-4 py-3 flex flex-wrap items-center gap-4">
      <span class="font-bold">El Carmen</span>
      <a href="/caja" data-link class="nav-link">Caja</a>
      <a href="/inventario" data-link class="nav-link">Inventario</a>
      <a href="/contabilidad" data-link class="nav-link">Contabilidad</a>
      <a href="/reportes" data-link class="nav-link">Reportes</a>
      <a href="/usuarios" data-link data-role="admin" class="nav-link">Usuarios</a>
      <span class="ml-auto flex items-center gap-3 text-sm">
        <span id="user-info"></span>
        <button id="btn-logout" class="bg-red-600 hover:bg-red-700 px-3 py-1 rounded">Salir</button>
      </span>
    </div>
  </nav>

  <!-- Contenedor dinámico -->
  <main id="app-root" class="max-w-6xl mx-auto p-4"></main>

  <script type="module" src="/js/app.js"></script>
</body>
</html>
