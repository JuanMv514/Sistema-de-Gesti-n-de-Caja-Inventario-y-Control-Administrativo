<div class="space-y-4">
  <div class="flex flex-wrap items-center gap-3">
    <h2 class="text-xl font-bold text-navy-900">Inventario</h2>
    <input id="buscar" type="search" placeholder="Buscar por nombre o código" class="border border-navy-200 rounded p-2 flex-1 min-w-[12rem]">
    <label class="text-sm flex items-center gap-1"><input id="solo-bajo" type="checkbox"> Solo stock bajo</label>
    <button id="btn-nuevo" class="bg-navy-700 hover:bg-navy-800 text-white rounded px-4 py-2">Nuevo producto</button>
  </div>

  <!-- Formulario de producto (crear/editar) -->
  <form id="form-producto" class="hidden bg-white p-4 rounded shadow grid grid-cols-12 gap-2 border-l-4 border-navy-700">
    <h3 id="titulo-form" class="col-span-12 font-semibold text-navy-800">Nuevo producto</h3>
    <input name="nombre" placeholder="Nombre" required class="col-span-12 md:col-span-4 border border-navy-200 rounded p-2">
    <input name="codigo" placeholder="Código (opcional)" class="col-span-6 md:col-span-2 border border-navy-200 rounded p-2">
    <input name="precio" type="number" min="0" step="any" placeholder="Precio" required class="col-span-6 md:col-span-2 border border-navy-200 rounded p-2">
    <input name="stock" type="number" min="0" step="any" placeholder="Stock inicial" value="0" class="col-span-6 md:col-span-2 border border-navy-200 rounded p-2">
    <input name="stockMinimo" type="number" min="0" step="any" placeholder="Stock mínimo" value="0" required class="col-span-6 md:col-span-2 border border-navy-200 rounded p-2">
    <div class="col-span-12 flex gap-2 items-center">
      <button class="bg-navy-700 hover:bg-navy-800 text-white rounded px-4 py-2">Guardar</button>
      <button type="button" id="btn-cancelar" class="border border-navy-700 text-navy-700 rounded px-4 py-2">Cancelar</button>
      <p id="msg-producto" class="text-sm text-red-600"></p>
    </div>
  </form>

  <!-- Movimiento de inventario -->
  <form id="form-movimiento" class="hidden bg-white p-4 rounded shadow flex flex-wrap items-end gap-2 border-l-4 border-navy-700">
    <h3 class="w-full font-semibold text-navy-800">Movimiento: <span id="mov-producto"></span></h3>
    <select name="tipo" class="border border-navy-200 rounded p-2">
      <option value="entrada">Entrada</option>
      <option value="salida">Salida</option>
    </select>
    <input name="cantidad" type="number" min="0.01" step="any" placeholder="Cantidad" required class="border border-navy-200 rounded p-2">
    <input name="motivo" placeholder="Motivo (compra, merma...)" class="border border-navy-200 rounded p-2 flex-1 min-w-[10rem]">
    <button class="bg-navy-700 hover:bg-navy-800 text-white rounded px-4 py-2">Registrar</button>
    <button type="button" id="btn-cancelar-mov" class="border border-navy-700 text-navy-700 rounded px-4 py-2">Cancelar</button>
    <p id="msg-mov" class="w-full text-sm text-red-600"></p>
  </form>

  <div class="bg-white rounded shadow overflow-x-auto">
    <table class="w-full text-sm">
      <thead class="bg-navy-900 text-white text-left">
        <tr><th class="p-2">Producto</th><th>Código</th><th>Precio</th><th>Stock</th><th>Mínimo</th><th></th></tr>
      </thead>
      <tbody id="tabla-productos"></tbody>
    </table>
  </div>

  <div class="bg-white rounded shadow overflow-x-auto">
    <h3 class="font-semibold text-navy-800 p-3">Últimos movimientos</h3>
    <table class="w-full text-sm">
      <thead class="bg-navy-100 text-navy-900 text-left">
        <tr><th class="p-2">Fecha</th><th>Producto</th><th>Tipo</th><th>Cantidad</th><th>Motivo</th><th>Usuario</th></tr>
      </thead>
      <tbody id="tabla-movimientos"></tbody>
    </table>
  </div>
</div>
